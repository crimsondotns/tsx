name: Transaction Sync Cron

on:
  schedule:
    # รันทุกชั่วโมง (ปรับตามต้องการ)
      - cron: '0 * * * *'      # ทุกชั่วโมง
  workflow_dispatch:  # รัน manual ได้

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Create .env file
        run: |
          echo "GOOGLE_SPREADSHEET_ID=${{ secrets.GOOGLE_SPREADSHEET_ID }}" >> .env
          echo "GOOGLE_SHEET_NAME=${{ secrets.GOOGLE_SHEET_NAME }}" >> .env
          echo "API_COOKIE=${{ secrets.API_COOKIE }}" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "API_ENDPOINT=${{ secrets.API_ENDPOINT }}" >> .env
          echo "API_ORIGIN=${{ secrets.API_ORIGIN }}" >> .env
          echo "API_REFERER=${{ secrets.API_REFERER }}" >> .env

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Create wallet.json
        run: |
          echo '${{ secrets.WALLETS_JSON }}' > wallet.json

      - name: Run transaction sync
        run: pnpm start
        timeout-minutes: 30
